plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
}

base {
    archivesName = 'flterraforged-fabric-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

def engineVersion = providers.gradleProperty('flterraforged_engine_version').get()
def modVersion = version.toString()
def configuredLocalEngineRepository = providers
        .gradleProperty('flterraforged_engine_local_repository')
        .orElse(providers.environmentVariable('FLTERRAFORGED_ENGINE_LOCAL_REPOSITORY'))
        .getOrNull()
def remoteEngineRepository = providers
        .gradleProperty('flterraforged_engine_repository_url')
        .orElse(providers.environmentVariable('FLTERRAFORGED_ENGINE_REPOSITORY_URL'))
        .orElse('https://raw.githubusercontent.com/jborkenhagen74/FlTerraForged-Engine/maven/')
        .get()

repositories {
    maven { url = 'https://maven.fabricmc.net/' }

    if (configuredLocalEngineRepository != null && !configuredLocalEngineRepository.isBlank()) {
        maven {
            name = 'flTerraForgedEngineLocalBuild'
            url = uri(configuredLocalEngineRepository)
        }
    } else {
        File siblingRepository = rootProject.file('../FlTerraForged-Engine/build/maven-repository')
        if (siblingRepository.isDirectory()) {
            maven {
                name = 'flTerraForgedEngineSiblingBuild'
                url = siblingRepository.toURI()
            }
        }
    }

    mavenLocal()
    mavenCentral()

    if (remoteEngineRepository != null && !remoteEngineRepository.isBlank()) {
        maven {
            name = 'flTerraForgedEnginePublic'
            url = uri(remoteEngineRepository)
            content {
                includeModule 'dev.foucaultleon', 'flterraforged-engine'
            }
        }
    }
}

sourceSets {
    main {
        // SourceDirectorySet.srcDirs(...) appends to Gradle's conventional
        // src/main/* directories. Because this version project already uses
        // those conventional directories, appending them again causes the
        // same resource (notably fabric.mod.json) to be processed twice on
        // Gradle 9.x. Replace the default roots instead of appending to them.
        java.setSrcDirs([
                rootProject.file('families/mc1201/common/src/main/java'),
                rootProject.file('families/mc1201/fabric/src/main/java'),
                rootProject.file('platforms/fabric/common/src/main/java'),
                file('src/main/java')
        ])
        resources.setSrcDirs([
                rootProject.file('families/mc1201/common/src/main/resources'),
                rootProject.file('families/mc1201/fabric/src/main/resources'),
                rootProject.file('platforms/fabric/common/src/main/resources'),
                file('src/main/resources')
        ])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${providers.gradleProperty('mc1201_minecraft_version').get()}"
    mappings "net.fabricmc:yarn:${providers.gradleProperty('mc1201_yarn_mappings').get()}:v2"
    modImplementation "net.fabricmc:fabric-loader:${providers.gradleProperty('mc1201_fabric_loader_version').get()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${providers.gradleProperty('mc1201_fabric_api_version').get()}"

    implementation project(':common')
    implementation project(':engine-api')
    include project(':common')
    include project(':engine-api')

    // The external Engine POM declares flterraforged-engine-api transitively.
    // In the host FlTerraForged build that API is already the local :engine-api
    // project, so exclude the remote copy and compile/runtime-link the Engine
    // against the exact API classes produced by this build. This also prevents
    // CI from depending on a previously published API snapshot just to compile
    // the host project.
    implementation("dev.foucaultleon:flterraforged-engine:${engineVersion}") {
        changing = engineVersion.endsWith('-SNAPSHOT')
        exclude group: 'dev.foucaultleon', module: 'flterraforged-engine-api'
    }

    // Loom's include configuration is intentionally non-transitive. The Engine
    // jar is embedded here; :engine-api and :common are embedded explicitly
    // above, so the final mod jar contains exactly one API implementation.
    include("dev.foucaultleon:flterraforged-engine:${engineVersion}")
}

configurations.configureEach {
    if (engineVersion.endsWith('-SNAPSHOT')) {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

loom {
    runs {
        server {
            server()
            name = 'FlTerraForged 1.20.1 Server'
        }
    }
}
