plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = 'flterraforged-engine-api'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Werror', true)
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'flterraforged-engine-api'

            pom {
                name = 'FlTerraForged Engine API'
                description = 'Minecraft-independent SPI/API used by FlTerraForged terrain engines.'
                url = 'https://github.com/jborkenhagen74/FlTerraForged'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }

                scm {
                    url = 'https://github.com/jborkenhagen74/FlTerraForged'
                    connection = 'scm:git:https://github.com/jborkenhagen74/FlTerraForged.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jborkenhagen74/FlTerraForged.git'
                }
            }
        }
    }

    // FEF-style build repository. CI publishes here first and then mirrors
    // this directory to the public `maven` branch. Consumers never need a
    // GitHub Packages token.
    repositories {
        maven {
            name = 'buildRepository'
            url = rootProject.layout.buildDirectory.dir('maven-repository')
        }
    }
}
