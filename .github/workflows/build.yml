name: Build R47

on:
  push:
    branches: [ 'revision/r47-hydraulic-shores' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify R47 with Engine R38
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout FlTerraForged R47
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify inherited owned-carver lifecycle
        run: python3 tools/verify-r46-lifecycle.py

      - name: Verify R47 hydraulic shores
        run: python3 tools/verify-r47-hydraulic-shores.py

      - name: Build R47 Engine API local repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Checkout Engine R38 source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged-Engine
          ref: revision/r38-water-authority-riparian
          path: .ci/engine-r38-source

      - name: Build Engine R38 local repository
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/build/maven-repository
        run: gradle -p .ci/engine-r38-source -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all publish

      - name: Build and test R47 with Engine R38
        env:
          FLTERRAFORGED_ENGINE_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/engine-r38-source/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check

      - name: Collect installable 1.20.1 Fabric R47 JAR
        id: collect_mc1201_fabric
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="versions/1.20.1/fabric/build/libs"
          mapfile -t jars < <(
            find "$lib_dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' \
              ! -name '*-shadow.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installable JAR in $lib_dir, found ${#jars[@]}."
            if [ "${#jars[@]}" -gt 0 ]; then
              printf 'Candidate: %s\n' "${jars[@]}"
            fi
            exit 1
          fi
          mkdir -p build/artifacts
          short_sha="${GITHUB_SHA:0:7}"
          artifact_path="build/artifacts/FlTerraForged-R47-1.20.1-Fabric-${short_sha}.jar"
          cp "${jars[0]}" "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Upload installable R47 JAR
        id: upload_mc1201_fabric
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-R47-1.20.1-Fabric
          path: ${{ steps.collect_mc1201_fabric.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R47 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_mc1201_fabric.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_mc1201_fabric.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_mc1201_fabric.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged R47 / Minecraft 1.20.1 Fabric"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Embedded Engine: R38"
            echo "- Coast material lock: enabled"
            echo "- Carving water: side/vertical component contact"
            echo "- Surface carving: reduced with dry-shore roofs"
            echo "- Variable-height materializer geometry: enabled"
            echo "- Shoreline patch decoration: enabled"
            echo "- Runtime dependency: Fabric API 0.92.2+1.20.1"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
