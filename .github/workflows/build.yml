name: Build R50

on:
  push:
    branches: [ 'revision/r50-receiver-overlay' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify R50 with pinned Engine R40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout FlTerraForged R50
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify inherited owned-carver lifecycle
        run: python3 tools/verify-r46-lifecycle.py

      - name: Verify inherited R48 submerged-floor and shoreline invariants
        run: python3 tools/verify-r48-seafloor-shores.py

      - name: Verify inherited R49 hydraulic quantization
        run: python3 tools/verify-r49-hydraulic-quantization.py

      - name: Verify R50 receiver-overlay pairing
        run: python3 tools/verify-r50-receiver-overlay.py

      - name: Build R50 Engine API local repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Checkout pinned Engine R40 source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged-Engine
          ref: c3b0655a1893023c5dc69eb7a4ebd8dfbcc1913c
          path: .ci/engine-r40-source

      - name: Build Engine R40 local repository
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/build/maven-repository
        run: gradle -p .ci/engine-r40-source -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all publish

      - name: Build and test R50 with Engine R40
        env:
          FLTERRAFORGED_ENGINE_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/engine-r40-source/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check

      - name: Collect installable 1.20.1 Fabric R50 JAR
        id: collect_mc1201_fabric
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="versions/1.20.1/fabric/build/libs"
          mapfile -t jars < <(
            find "$lib_dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' \
              ! -name '*-shadow.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installable JAR in $lib_dir, found ${#jars[@]}."
            if [ "${#jars[@]}" -gt 0 ]; then
              printf 'Candidate: %s\n' "${jars[@]}"
            fi
            exit 1
          fi
          mkdir -p build/artifacts
          short_sha="${GITHUB_SHA:0:7}"
          artifact_path="build/artifacts/FlTerraForged-R50-1.20.1-Fabric-${short_sha}.jar"
          cp "${jars[0]}" "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Upload installable R50 JAR
        id: upload_mc1201_fabric
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-R50-1.20.1-Fabric
          path: ${{ steps.collect_mc1201_fabric.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R50 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_mc1201_fabric.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_mc1201_fabric.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_mc1201_fabric.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged R50 / Minecraft 1.20.1 Fabric"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Embedded Engine: R40"
            echo "- Engine commit: \`c3b0655a1893023c5dc69eb7a4ebd8dfbcc1913c\`"
            echo "- Drainage and incision source: same post-erosion terrain"
            echo "- Final Engine hydrology order: river -> wet-core -> receiver overlay"
            echo "- Ocean/lake receiver geometry applied before Minecraft materialization"
            echo "- Duplicate erosion sampling in receiver overlay: none"
            echo "- Post-generation water repair pass: none"
            echo "- R49 height quantization: retained"
            echo "- R48 submerged-floor seal: retained"
            echo "- Variable-height provider geometry: retained"
            echo "- Runtime dependency: Fabric API 0.92.2+1.20.1"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
