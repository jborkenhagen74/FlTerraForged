name: Build

on:
  push:
    branches: [ develop, main, 'revision/**', 'release/**' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify layout
        run: python3 tools/verify-layout.py

      - name: Build and test against published Engine R52 snapshot
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check

      - name: Collect and verify combined R62 + R52 1.20.1 Fabric JAR
        id: collect_mc1201_fabric
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="versions/1.20.1/fabric/build/libs"
          mapfile -t jars < <(
            find "$lib_dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' ! -name '*-shadow.jar' -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installable JAR in $lib_dir, found ${#jars[@]}."
            if [ "${#jars[@]}" -gt 0 ]; then
              printf 'Candidate: %s\n' "${jars[@]}"
            fi
            exit 1
          fi

          mkdir -p build/artifacts
          short_sha="${GITHUB_SHA:0:7}"
          artifact_path="build/artifacts/FlTerraForged-R62-Engine-R52-1.20.1-Fabric-${short_sha}.jar"
          cp "${jars[0]}" "$artifact_path"

          engine_entry="$(unzip -Z1 "$artifact_path" | grep -E '(^|/)flterraforged-engine-[^/]+\.jar$' | head -n 1 || true)"
          if [ -z "$engine_entry" ]; then
            echo "::error::Combined mod JAR does not contain the external Engine JAR."
            exit 1
          fi
          unzip -p "$artifact_path" "$engine_entry" > build/artifacts/embedded-engine.jar
          if ! unzip -p build/artifacts/embedded-engine.jar \
              dev/foucaultleon/flterraforged/engine/DefaultEngineProvider.class \
              | grep -a -q '0.1.0-SNAPSHOT-r52'; then
            echo "::error::Combined mod JAR does not contain FlTerraForged-Engine R52."
            exit 1
          fi

          echo "Verified embedded Engine R52: $engine_entry"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Upload combined installable 1.20.1 Fabric JAR
        id: upload_mc1201_fabric
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.collect_mc1201_fabric.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_mc1201_fabric.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_mc1201_fabric.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_mc1201_fabric.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged R62 + Engine R52 Minecraft 1.20.1 Fabric artifact"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Embedded Engine: verified FlTerraForged-Engine R52"
            echo "- Coast: one physical shoreline authority; no post-hoc marine apron lift"
            echo "- Ocean: contiguous canonical water columns and deeper shallow-water cave seal"
            echo "- Rivers: geometry-neutral decoration; no stairs, dams or spray geometry"
            echo "- Structures: villages require a conservative dry placement stencil"
            echo "- Cold start: structure checks stay on the cheap placement sampler"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-engine-api-snapshot:
    name: Publish Engine API Snapshot
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/release/r57-engine-owned-worldgen' ||
       github.ref == 'refs/heads/release/r59-cold-start-coast-fix' ||
       github.ref == 'refs/heads/release/r60-biome-vegetation-performance' ||
       github.ref == 'refs/heads/release/r61-water-biome-coldstart-performance' ||
       github.ref == 'refs/heads/release/r62-coast-ocean-structure-consistency')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build Maven repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all :engine-api:publish

      - name: Publish Maven repository branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: maven
          publish_dir: ./build/maven-repository
          keep_files: true
          force_orphan: false
          commit_message: "Publish Engine API R62 ${{ github.sha }}"
