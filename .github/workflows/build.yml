name: Build R52

on:
  push:
    branches: [ 'revision/r52-resolved-water-field' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify R52 with Engine R42
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout FlTerraForged R52
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify inherited owned-carver lifecycle
        run: python3 tools/verify-r46-lifecycle.py

      - name: Verify inherited R48 submerged-floor and shoreline invariants
        run: python3 tools/verify-r48-seafloor-shores.py

      - name: Verify inherited R49 hydraulic quantization
        run: python3 tools/verify-r49-hydraulic-quantization.py

      - name: Verify inherited R51 startup-liveness invariants
        run: python3 tools/verify-r51-startup-liveness.py

      - name: Verify R52 resolved-water/provider geometry invariants
        run: python3 tools/verify-r52-resolved-water-field.py

      - name: Build R52 Engine API local repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Checkout Engine R42 source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged-Engine
          ref: revision/r42-resolved-water-field
          path: .ci/engine-r42-source

      - name: Verify Engine R42 resolved water invariants
        run: python3 .ci/engine-r42-source/tools/verify-r42-resolved-water-field.py

      - name: Build, test and publish Engine R42 local repository
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/build/maven-repository
        run: gradle -p .ci/engine-r42-source -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check publish

      - name: Build and test R52 with Engine R42
        env:
          FLTERRAFORGED_ENGINE_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/engine-r42-source/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check

      - name: Collect installable 1.20.1 Fabric R52 JAR
        id: collect_mc1201_fabric
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="versions/1.20.1/fabric/build/libs"
          mapfile -t jars < <(
            find "$lib_dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-dev-shadow.jar' \
              ! -name '*-shadow.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installable JAR in $lib_dir, found ${#jars[@]}."
            if [ "${#jars[@]}" -gt 0 ]; then
              printf 'Candidate: %s\n' "${jars[@]}"
            fi
            exit 1
          fi
          mkdir -p build/artifacts
          short_sha="${GITHUB_SHA:0:7}"
          artifact_path="build/artifacts/FlTerraForged-R52-1.20.1-Fabric-${short_sha}.jar"
          cp "${jars[0]}" "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Upload installable R52 JAR
        id: upload_mc1201_fabric
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-R52-1.20.1-Fabric
          path: ${{ steps.collect_mc1201_fabric.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R52 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_mc1201_fabric.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_mc1201_fabric.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_mc1201_fabric.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged R52 / Minecraft 1.20.1 Fabric"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Engine: R42 resolved water field"
            echo "- Final hydraulic ownership: OCEAN > LAKE > RIVER > DRY"
            echo "- River mouths: receiver surface authority and bounded bed blend"
            echo "- River joins: deterministic higher-flow main stem"
            echo "- Provider X/Z physical geometry: used by column composition, height queries and surface reconciliation"
            echo "- Waterloggable partial tops: retained through provider final-wet hooks"
            echo "- Non-waterloggable partial tops: never replaced by same-cell full fluid"
            echo "- Marine structure checks: canonical quantizer plus provider wet geometry"
            echo "- Obsolete HydrologyFillPass: removed"
            echo "- Marine column/ring cache: bounded inline single-flight"
            echo "- Worldgen-executor scheduling from cache loaders: none"
            echo "- Post-generation water repair pass: none"
            echo "- Runtime dependency: Fabric API 0.92.2+1.20.1"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
